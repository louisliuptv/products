# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build performance: parallel + cached builds, and configuration cache.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Kotlin
kotlin.code.style=official

# AndroidX is mandatory for Jetpack Compose.
android.useAndroidX=true

# Only keep the resources for the languages we actually ship, plus density splits off.
android.nonTransitiveRClass=true
